<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tariq Mehmood, Senior Software Engineer and Solution Architect">
  <style>
    .sans { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .label { font-size: 14px; font-weight: 600; letter-spacing: 3px; fill: #8a8a8a; }
    .name { font-size: 124px; font-weight: 800; letter-spacing: -5px; fill: #fafafa; }
    .role { font-size: 24px; font-weight: 600; fill: #fafafa; }
    .sub { font-size: 17px; fill: #8a8a8a; }
    .strip { font-size: 15px; font-weight: 600; letter-spacing: 2.5px; fill: #6b6b6b; }
    .accent { fill: #f5a524; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .marquee { animation: slide 28s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
  </style>

  <rect width="1200" height="420" rx="18" fill="#0a0a0a" />

  <circle class="pulse" cx="52" cy="51" r="5" fill="#22c55e" />
  <text class="sans label" x="66" y="56">AVAILABLE FOR NEW PROJECTS</text>
  <text class="sans label" x="1152" y="56" text-anchor="end">LAHORE, PAKISTAN</text>

  <text class="sans name" x="40" y="194">Tariq</text>
  <text class="sans name" x="40" y="306">Mehmood<tspan class="accent">.</tspan></text>

  <text class="sans role" x="1152" y="236" text-anchor="end">Senior Software Engineer</text>
  <text class="sans role" x="1152" y="268" text-anchor="end">&amp; Solution Architect</text>
  <text class="sans sub" x="1152" y="302" text-anchor="end">Distributed, real-time and AI-powered systems</text>

  <line x1="40" y1="344" x2="1160" y2="344" stroke="#1f1f1f" />

  <svg x="0" y="350" width="1200" height="50">
    <g class="marquee">
      <text class="sans strip" x="0" y="30" textLength="1200" lengthAdjust="spacing">SOFTWARE ARCHITECT <tspan class="accent">✦</tspan> DISTRIBUTED SYSTEMS <tspan class="accent">✦</tspan> AI ENGINEER <tspan class="accent">✦</tspan> REAL-TIME SYSTEMS <tspan class="accent">✦</tspan> CREATOR OF AXILJS <tspan class="accent">✦</tspan></text>
      <text class="sans strip" x="1200" y="30" textLength="1200" lengthAdjust="spacing">SOFTWARE ARCHITECT <tspan class="accent">✦</tspan> DISTRIBUTED SYSTEMS <tspan class="accent">✦</tspan> AI ENGINEER <tspan class="accent">✦</tspan> REAL-TIME SYSTEMS <tspan class="accent">✦</tspan> CREATOR OF AXILJS <tspan class="accent">✦</tspan></text>
    </g>
  </svg>
</svg>
