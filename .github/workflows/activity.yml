name: Update activity card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/activity.mjs, .github/workflows/activity.yml]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate assets/activity.svg
        env:
          # Add a METRICS_TOKEN secret (classic PAT with read:user and repo) to include private activity.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/activity.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --staged --quiet || (git commit -m "Update activity card" && git push)
